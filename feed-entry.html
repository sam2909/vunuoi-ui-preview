<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>Nhập thức ăn N302 · VUNUOI</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#132235;font:14px system-ui,-apple-system,sans-serif}.app{min-height:100vh;padding-bottom:calc(94px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dce3e7;padding:calc(9px + env(safe-area-inset-top)) 14px 9px}.topin{max-width:760px;margin:auto;display:grid;grid-template-columns:90px 1fr 90px;align-items:center}.back,.close{border:0;background:transparent;color:#0f766e;font-weight:900;padding:8px 0}.back{text-align:left}.close{text-align:right}.toptitle{text-align:center;font-size:13px;font-weight:950}.main{width:100%;max-width:560px;margin:auto;padding:16px 12px}.context{display:flex;justify-content:space-between;align-items:flex-start;padding:2px 2px 14px}.eyebrow,.label{font-size:10px;color:#64748b;font-weight:850}.pond{font-size:28px;font-weight:950;margin-top:3px}.meta{font-size:11px;color:#64748b;margin-top:5px}.unitpill{font-size:10px;font-weight:900;padding:6px 9px;background:#e8f5f2;color:#0f766e;border-radius:99px}.range{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#e1e9eb;border-radius:12px}.range button{border:0;background:transparent;color:#64748b;border-radius:9px;padding:10px 5px;font-size:11px;font-weight:900}.range button.on{background:#fff;color:#0f766e;box-shadow:0 1px 5px #0f172a18}.hint{font-size:11px;color:#64748b;line-height:1.45;margin:10px 3px 12px}.days{display:grid;gap:10px}.day{background:#fff;border:1px solid #d9e1e5;border-radius:16px;overflow:hidden}.dayhead{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid #e7ecee}.dayname{font-weight:950}.daytotal{font-size:12px;font-weight:950;color:#0f766e}.meals{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e7ecee}.meal{background:#fff;padding:10px 7px}.meal label{display:block;font-size:9px;color:#64748b;font-weight:850;text-align:center}.meal input{display:block;width:100%;border:0;border-bottom:2px solid #dbe4e6;outline:0;background:transparent;text-align:center;font-size:20px;font-weight:950;color:#132235;padding:8px 1px 5px}.meal input:focus{border-color:#0f766e}.mealunit{text-align:center;color:#94a3b8;font-size:9px;margin-top:3px}.dayfoot{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;background:#fafcfc}.copy{border:0;background:transparent;color:#0f766e;font-size:10px;font-weight:900}.daynote{font-size:10px;color:#94a3b8}.summary{margin-top:12px;background:#fff;border:1px solid #cfe0dc;border-radius:15px;padding:12px;display:flex;justify-content:space-between;align-items:baseline}.summary span{font-size:11px;color:#64748b}.summary b{font-size:21px;color:#0f766e}.sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fffffff5;backdrop-filter:blur(10px);border-top:1px solid #dce3e7;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.save{display:block;width:100%;max-width:532px;margin:auto;border:0;border-radius:13px;padding:14px;background:#0f766e;color:#fff;font-weight:950}.save:disabled{opacity:.45}.done{display:none;text-align:center;padding:50px 18px}.done.on{display:block}.check{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#dff4ee;color:#0f766e;font-size:27px;font-weight:950}.done h1{font-size:23px;margin:13px 0 6px}.done p{font-size:12px;color:#64748b;line-height:1.5;margin:0}.done .save{margin-top:20px}.form.off,.sticky.off{display:none}@media(max-width:390px){.main{padding-left:9px;padding-right:9px}.meal{padding-left:4px;padding-right:4px}.meal input{font-size:18px}}@media(min-width:700px){body{background:#dce5e7}.app{padding:34px 0}.top{position:static;max-width:760px;margin:auto;border:1px solid #d7e0e3;border-bottom:0;border-radius:20px 20px 0 0}.main{max-width:760px;background:#eef2f4;border-left:1px solid #d7e0e3;border-right:1px solid #d7e0e3;padding:22px 44px 110px;min-height:650px}.days{grid-template-columns:repeat(2,1fr)}.day:first-child:last-child{grid-column:1/-1;max-width:330px}.sticky{position:static;max-width:760px;margin:auto;border:1px solid #d7e0e3;border-top:0;border-radius:0 0 20px 20px;padding:14px 44px 18px}.done{padding-top:100px}} 
</style></head><body><div class="app"><header class="top"><div class="topin"><button class="back" onclick="history.back()">‹ Ghi dữ liệu</button><div class="toptitle">Thức ăn</div><button class="close" onclick="location.href='pond-detail.html'">Đóng</button></div></header><main class="main"><div class="form" id="form"><div class="context"><div><div class="eyebrow">AO ĐÃ CHỌN</div><div class="pond">N302</div><div class="meta">Mùa 27 · Khu B · ngày nuôi 92</div></div><span class="unitpill">Đơn vị kg</span></div><div class="range"><button data-days="1">Hôm nay</button><button class="on" data-days="3">3 ngày</button><button data-days="7">7 ngày</button></div><div class="hint">Mỗi dòng là một ngày. Bỏ trống cữ không cho ăn; số 0 dùng khi cần ghi nhận có kiểm tra nhưng không cho ăn.</div><div class="days" id="days"></div><div class="summary"><span>Tổng lượng đang nhập</span><b id="grandTotal">0 kg</b></div></div><div class="done" id="done"><div class="check">✓</div><h1>Đã lưu thức ăn N302</h1><p id="result"></p><p>Dữ liệu đã được thêm vào nhật ký ao.</p><button class="save" onclick="location.href='pond-detail.html'">Về ao N302</button></div></main><div class="sticky" id="sticky"><button class="save" id="save" disabled>Lưu thức ăn N302</button></div></div>
<script>
const meals=['Sáng','Trưa','Chiều','Tối'],daysEl=document.getElementById('days'),grand=document.getElementById('grandTotal'),save=document.getElementById('save');let range=3;
const pad=n=>String(n).padStart(2,'0'),fmt=(n,d=1)=>Number(n).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d}),dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),dateLabel=(d,i)=>i===0?'Hôm nay · '+pad(d.getDate())+'/'+pad(d.getMonth()+1):(i===1?'Hôm qua · ':'')+pad(d.getDate())+'/'+pad(d.getMonth()+1);
function render(){daysEl.innerHTML='';const now=new Date();for(let i=0;i<range;i++){const d=new Date(now);d.setDate(now.getDate()-i);const card=document.createElement('section');card.className='day';card.dataset.date=dateKey(d);card.innerHTML='<div class="dayhead"><span class="dayname">'+dateLabel(d,i)+'</span><span class="daytotal">0 kg</span></div><div class="meals">'+meals.map((m,j)=>'<div class="meal"><label>'+m.toUpperCase()+'</label><input inputmode="decimal" aria-label="'+m+'" data-meal="'+j+'" placeholder="—"><div class="mealunit">kg</div></div>').join('')+'</div><div class="dayfoot"><span class="daynote">4 cữ trong ngày</span>'+(i?'<button class="copy" type="button">Sao chép ngày trên</button>':'<span></span>')+'</div>';daysEl.appendChild(card)}bind();recalc()}
function num(v){const n=Number(String(v).replace(',','.'));return Number.isFinite(n)&&n>=0?n:0}
function recalc(){let total=0,has=false;document.querySelectorAll('.day').forEach(day=>{let sum=0;day.querySelectorAll('input').forEach(x=>{if(x.value.trim()!=='')has=true;sum+=num(x.value)});day.querySelector('.daytotal').textContent=fmt(sum)+' kg';total+=sum});grand.textContent=fmt(total)+' kg';save.disabled=!has;return total}
function bind(){document.querySelectorAll('.meal input').forEach(x=>x.addEventListener('input',recalc));document.querySelectorAll('.copy').forEach(btn=>btn.addEventListener('click',()=>{const day=btn.closest('.day'),prev=day.previousElementSibling;day.querySelectorAll('input').forEach((x,i)=>x.value=prev.querySelectorAll('input')[i].value);recalc()}))}
document.querySelectorAll('.range button').forEach(btn=>btn.addEventListener('click',()=>{range=Number(btn.dataset.days);document.querySelectorAll('.range button').forEach(x=>x.classList.toggle('on',x===btn));render()}));
save.addEventListener('click',()=>{const entries=[...document.querySelectorAll('.day')].map(day=>({date:day.dataset.date,meals:[...day.querySelectorAll('input')].map(x=>x.value.trim()===''?null:num(x.value)),total:[...day.querySelectorAll('input')].reduce((a,x)=>a+num(x.value),0)})).filter(x=>x.meals.some(v=>v!==null)),total=entries.reduce((a,x)=>a+x.total,0);sessionStorage.setItem('vunuoi:n302:feed',JSON.stringify({entries,total,savedAt:new Date().toISOString()}));document.getElementById('result').textContent=entries.length+' ngày · tổng '+fmt(total)+' kg';document.getElementById('form').classList.add('off');document.getElementById('sticky').classList.add('off');document.getElementById('done').classList.add('on');scrollTo(0,0)});render();
</script><!-- Pond scope is preselected. Production should upsert entries per pond/date/meal and return authoritative totals before updating Pond Detail. --></body></html>
