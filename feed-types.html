<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>Loại cám · VUNUOI</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#132235;font:14px system-ui,-apple-system,sans-serif}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dce3e7;padding:calc(9px + env(safe-area-inset-top)) 14px 9px}.topin{max-width:680px;margin:auto;display:grid;grid-template-columns:80px 1fr 80px;align-items:center}.back,.addtop{border:0;background:transparent;color:#0f766e;font-weight:900;padding:8px 0}.addtop{text-align:right}.title{text-align:center;font-weight:950}.main{max-width:560px;margin:auto;padding:18px 12px}.hero h1{font-size:26px;margin:0}.hero p{font-size:11px;color:#64748b;line-height:1.45;margin:6px 0 15px}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #d9e1e5;border-radius:14px;padding:12px}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-weight:950}.code{font-size:10px;color:#64748b;margin-top:3px}.badge{font-size:9px;font-weight:900;border-radius:99px;padding:5px 7px;background:#e5f4f0;color:#0f766e}.badge.hidden{background:#eef1f3;color:#64748b}.actions{display:flex;gap:7px;margin-top:11px}.actions button{border:1px solid #dce3e6;background:#fff;color:#475569;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:850}.actions .danger{color:#b91c1c}.notice{margin-top:12px;padding:11px;border-radius:11px;background:#fff8df;color:#7c5512;font-size:10px;line-height:1.45}.modal{display:none;position:fixed;inset:0;background:#0f172a55;z-index:30;place-items:end center}.modal.on{display:grid}.sheet{width:100%;max-width:560px;background:#fff;border-radius:20px 20px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px}.field{display:block;margin-top:10px}.field span{display:block;font-size:10px;color:#64748b;font-weight:850;margin-bottom:5px}.field input{width:100%;border:1px solid #dce3e6;border-radius:11px;padding:12px;font:inherit}.save{width:100%;border:0;background:#0f766e;color:#fff;border-radius:12px;padding:13px;font-weight:950;margin-top:14px}@media(min-width:700px){body{background:#dce5e7}.main{max-width:680px;background:#eef2f4;min-height:calc(100vh - 58px);padding:28px 70px}.sheet{border-radius:20px;margin:auto;align-self:center}.modal{place-items:center}} 
.returnlink{border:0;background:transparent;color:#0f766e;font-size:11px;font-weight:900;padding:0;margin:0 0 12px}</style></head><body><header class="top"><div class="topin"><button class="back" onclick="location.href='index.html#home'">⌂ Hôm nay</button><div class="title">Danh mục cám</div><button class="addtop" onclick="openForm()">＋ Thêm</button></div></header><main class="main"><div class="hero"><h1>Loại cám</h1><p>Chỉ loại đang sử dụng xuất hiện trong form nhập. Loại đã có lịch sử không xóa cứng; hãy ẩn hoặc ngừng sử dụng để giữ đúng dữ liệu cũ.</p></div><button class="returnlink" onclick="location.href='feed-entry.html'">‹ Quay lại form thức ăn</button><div class="list" id="list"></div><div class="notice">“Cắt cữ/không cho ăn” không nằm trong danh mục này. Đó là trạng thái vận hành của từng ngày.</div></main><div class="modal" id="modal" onclick="if(event.target===this)closeForm()"><div class="sheet"><h2 id="formTitle">Thêm loại cám</h2><label class="field"><span>TÊN LOẠI CÁM</span><input id="feedName" placeholder="Ví dụ: Thăng Long Beikesu 04"></label><label class="field"><span>MÃ NỘI BỘ · KHÔNG BẮT BUỘC</span><input id="feedCode" placeholder="TL-BK04"></label><button class="save" onclick="saveFeed()">Lưu loại cám</button></div></div><script>
let feeds=[{name:'Thăng Long Beikesu 02',code:'TL-BK02',active:true},{name:'Thăng Long Beikesu 03',code:'TL-BK03',active:true},{name:'Grobest No. 2',code:'GB-02',active:true},{name:'CP 9034',code:'CP-9034',active:false}],editing=-1;function render(){document.getElementById('list').innerHTML=feeds.map((x,i)=>'<div class="item"><div class="itemtop"><div><div class="name">'+x.name+'</div><div class="code">'+(x.code||'Chưa có mã')+'</div></div><span class="badge '+(x.active?'':'hidden')+'">'+(x.active?'Đang dùng':'Đã ẩn')+'</span></div><div class="actions"><button onclick="editFeed('+i+')">Sửa</button><button onclick="toggleFeed('+i+')">'+(x.active?'Ẩn':'Hiện lại')+'</button><button class="danger" onclick="removeFeed('+i+')">Xóa</button></div></div>').join('')}function openForm(){editing=-1;document.getElementById('formTitle').textContent='Thêm loại cám';feedName.value='';feedCode.value='';modal.classList.add('on')}function editFeed(i){editing=i;formTitle.textContent='Sửa loại cám';feedName.value=feeds[i].name;feedCode.value=feeds[i].code;modal.classList.add('on')}function closeForm(){modal.classList.remove('on')}function saveFeed(){if(!feedName.value.trim())return;const value={name:feedName.value.trim(),code:feedCode.value.trim(),active:true};if(editing>=0)value.active=feeds[editing].active,feeds[editing]=value;else feeds.unshift(value);closeForm();render()}function toggleFeed(i){feeds[i].active=!feeds[i].active;render()}function removeFeed(i){alert('Loại cám đã có lịch sử thì không xóa cứng. Hãy dùng “Ẩn”. Trong bản thật, chỉ loại chưa từng phát sinh dữ liệu mới được xóa.')}render();
</script></body></html>
