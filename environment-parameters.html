<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>Thông số môi trường · VUNUOI</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#132235;font:14px system-ui,-apple-system,sans-serif}.app{min-height:100vh}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dce3e7;padding:calc(9px + env(safe-area-inset-top)) 14px 9px}.topin{max-width:680px;margin:auto;display:grid;grid-template-columns:92px 1fr 92px;align-items:center}.back,.add{border:0;background:transparent;color:#0f766e;font-weight:900;padding:8px 0}.back{text-align:left}.add{text-align:right}.title{text-align:center;font-size:13px;font-weight:950}.main{max-width:620px;margin:auto;padding:18px 12px 35px}.intro h1{font-size:25px;margin:0}.intro p{font-size:11px;color:#64748b;line-height:1.5;margin:6px 0 14px}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #d9e1e5;border-radius:15px;padding:13px}.item.hidden{opacity:.58}.itemtop{display:flex;justify-content:space-between;gap:10px}.name{font-weight:950}.unit{font-size:10px;color:#64748b;margin-top:3px}.badge{font-size:9px;font-weight:900;padding:5px 7px;border-radius:99px;background:#e8f5f2;color:#0f766e;height:max-content}.badge.off{background:#f1f5f7;color:#64748b}.actions{display:flex;gap:7px;margin-top:11px}.actions button{border:1px solid #dce3e6;background:#fff;color:#475569;border-radius:9px;padding:7px 10px;font-size:10px;font-weight:900}.actions .danger{color:#c62828;border-color:#fecaca}.editor{display:none;background:#fff;border:1px solid #9dc8be;border-radius:16px;padding:14px;margin-bottom:12px}.editor.on{display:block}.editor h2{font-size:15px;margin:0 0 11px}.fields{display:grid;grid-template-columns:1.4fr .8fr;gap:9px}.field label{display:block;font-size:9px;color:#64748b;font-weight:850;margin-bottom:5px}.field input{width:100%;border:1px solid #dce3e6;border-radius:10px;padding:11px;font:inherit}.editoractions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.editoractions button{border:1px solid #dce3e6;background:#fff;border-radius:10px;padding:9px 12px;font-weight:900}.editoractions .save{border:0;background:#0f766e;color:#fff}.note{font-size:10px;color:#64748b;line-height:1.45;margin:13px 2px}@media(min-width:700px){body{background:#dce5e7}.app{padding:7vh 0}.shell{max-width:700px;margin:auto;border-radius:20px;overflow:hidden;box-shadow:0 24px 70px #0f172a2e}.top{position:static;border:1px solid #d7e0e3;border-bottom:0}.main{max-width:none;background:#eef2f4;border:1px solid #d7e0e3;border-top:0;padding:25px 40px 38px;min-height:560px}}
</style></head><body><div class="app"><div class="shell"><header class="top"><div class="topin"><button class="back" onclick="location.href='environment-entry.html'">‹ Môi trường</button><div class="title">Thông số môi trường</div><button class="add" id="add">＋ Thêm</button></div></header><main class="main"><div class="intro"><h1>Thông số đang quản lý</h1><p>Chỉ các thông số đang hiển thị mới xuất hiện trong form nhập. Dữ liệu cũ vẫn được giữ khi một thông số bị ẩn.</p></div><section class="editor" id="editor"><h2 id="editorTitle">Thêm thông số</h2><div class="fields"><div class="field"><label>TÊN THÔNG SỐ</label><input id="name" placeholder="Ví dụ: Độ kiềm"></div><div class="field"><label>ĐƠN VỊ</label><input id="unit" placeholder="mg/L"></div></div><div class="editoractions"><button id="cancel">Hủy</button><button class="save" id="save">Lưu thông số</button></div></section><div class="list" id="list"></div><p class="note">Thông số đã có dữ liệu chỉ được ẩn, không xóa cứng. Ngưỡng cảnh báo sẽ được cấu hình riêng ở bước tiếp theo.</p></main></div></div><script>
const defaults=[{id:'ph',name:'pH',unit:'',active:true,used:true},{id:'do',name:'DO',unit:'mg/L',active:true,used:true},{id:'temp',name:'Nhiệt độ',unit:'°C',active:true,used:true},{id:'salinity',name:'Độ mặn',unit:'‰',active:true,used:true}],key='vunuoi:environment:parameters';let items,editing=null;try{items=JSON.parse(sessionStorage.getItem(key))}catch(e){}if(!Array.isArray(items)||!items.length)items=defaults;const list=document.getElementById('list'),editor=document.getElementById('editor'),nameInput=document.getElementById('name'),unitInput=document.getElementById('unit');function persist(){sessionStorage.setItem(key,JSON.stringify(items))}function render(){list.innerHTML='';items.forEach(item=>{const el=document.createElement('article');el.className='item'+(item.active?'':' hidden');el.innerHTML='<div class="itemtop"><div><div class="name"></div><div class="unit"></div></div><span class="badge"></span></div><div class="actions"><button class="edit">Sửa</button><button class="toggle"></button>'+(item.used?'':'<button class="danger">Xóa</button>')+'</div>';el.querySelector('.name').textContent=item.name;el.querySelector('.unit').textContent=item.unit?'Đơn vị: '+item.unit:'Không có đơn vị';const badge=el.querySelector('.badge');badge.textContent=item.active?'Đang hiển thị':'Đã ẩn';badge.classList.toggle('off',!item.active);el.querySelector('.toggle').textContent=item.active?'Ẩn':'Hiện lại';el.querySelector('.edit').onclick=()=>openEditor(item);el.querySelector('.toggle').onclick=()=>{item.active=!item.active;persist();render()};const del=el.querySelector('.danger');if(del)del.onclick=()=>{items=items.filter(x=>x.id!==item.id);persist();render()};list.appendChild(el)})}function openEditor(item=null){editing=item;document.getElementById('editorTitle').textContent=item?'Sửa thông số':'Thêm thông số';nameInput.value=item?item.name:'';unitInput.value=item?item.unit:'';editor.classList.add('on');nameInput.focus()}document.getElementById('add').onclick=()=>openEditor();document.getElementById('cancel').onclick=()=>editor.classList.remove('on');document.getElementById('save').onclick=()=>{const name=nameInput.value.trim(),unit=unitInput.value.trim();if(!name){nameInput.focus();return}if(editing){editing.name=name;editing.unit=unit}else items.push({id:'custom-'+Date.now(),name,unit,active:true,used:false});persist();editor.classList.remove('on');render()};persist();render();
</script></body></html>
