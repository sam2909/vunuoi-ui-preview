.appnav{display:none;position:fixed;inset:0;z-index:80;background:#0f172a55;align-items:flex-end;justify-content:center}.appnav.on{display:flex}.navsheet{width:100%;max-width:560px;background:#fff;border-radius:20px 20px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px #0f172a22}.navhandle{width:38px;height:4px;border-radius:9px;background:#cbd5e1;margin:0 auto 12px}..nav}.navnavtitle{font-size:13px;font-weight:950;margin:0 2px 9px}.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.navgrid button{border:1px solid #dce3e6;background:#fff;color:#132235;border-radius:12px;padding:12px;text-align:left;font-weight:900}.navgrid button:first-child{border-color:#9dc8be;background:#edf8f5;color:#0f766e}.navcancel{width:100%;border:0;background:#eef2f4;color:#475569;border-radius:12px;padding:12px;margin-top:9px;font-weight:900}</style></head><body><div class="app"><div class="sheet"><header class="top"><div class="topin"><button class="back" onclick="leave('data-entry.html')">‹ Ghi dữ liệu</button><div class="title">Ghi chú / Tạo việc</div><button class="close" onclick="document.getElementById('appnav').classList.add('on')">Đi đến ▾</button></div></header><main class="main"><div class="form" id="form"><div class="context"><div><div class="eyebrow">PHẠM VI ĐÃ CHỌN</div><div class="pond">Ao N302</div><div class="meta">Mùa 27 · Khu B</div></div><span class="pill">N302</span></div><div class="modes"><button class="on" data-mode="note">Ghi chú</button><button data-mode="task">Tạo việc cần làm</button></div><section class="panel"><div class="noteonly"><div class="paneltitle">Ghi nhận vào nhật ký ao</div><div class="field"><label>NỘI DUNG</label><textarea id="noteContent" placeholder="Ví dụ: nước ao đậm màu hơn sau mưa…"></textarea></div><div class="field"><label>THỜI ĐIỂM XẢY RA</label><div class="datetime"><input type="date" id="noteDate"><input type="time" id="noteTime"></div></div></div><div class="taskonly"><div class="paneltitle">Việc cần làm tại N302</div><div class="field"><label>TÊN VIỆC</label><input id="taskTitle" placeholder="Ví dụ: kiểm tra lại màu nước"></div><div class="field"><label>HẠN LÀM</label><div class="datetime"><input type="date" id="dueDate"><input type="time" id="dueTime"></div></div><div class="field"><label>MỨC ƯU TIÊN</label><div class="priority"><button type="button" data-priority="low">Bình thường</button><button type="button" class="on" data-priority="medium">Cần chú ý</button><button type="button" data-priority="high">Gấp</button></div></div><div class="field"><label>GHI CHÚ · KHÔNG BẮT BUỘC</label><textarea id="taskNote" placeholder="Thêm hướng dẫn hoặc điều cần theo dõi…"></textarea></div></div></section><p class="hint" id="hint">Ghi chú là chuyện đã xảy ra và chỉ vào nhật ký. Nó không tạo thành việc phải hoàn thành.</p></div><div class="done" id="done"><div class="check">✓</div><h1 id="doneTitle"></h1><p id="result"></p><button class="save" onclick="location.href='pond-detail.html'">Về ao N302</button></div></main><div class="sticky" id="sticky"><div class="stickyin"><div class="savehint" id="saveHint">Nội dung sẽ được thêm vào nhật ký N302.</div><button class="save" id="save" disabled>Lưu ghi chú</button></div></div></div></div><script>
const pad=n=>String(n).padStart(2,'0'),now=new Date(),today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate()),clock=pad(now.getHours())+':'+pad(now.getMinutes()),form=document.getElementById('form'),save=document.getElementById('save');let mode='note',priority='medium';document.getElementById('noteDate').value=today;document.getElementById('noteTime').value=clock;document.getElementById('dueDate').value=today;document.getElementById('dueTime').value=clock;function validate(){save.disabled=mode==='note'?!document.getElementById('noteContent').value.trim():!document.getElementById('taskTitle').value.trim()}document.querySelectorAll('.modes button').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===btn));form.classList.toggle('taskmode',mode==='task');save.textContent=mode==='note'?'Lưu ghi chú':'Tạo việc N302';document.getElementById('saveHint').textContent=mode==='note'?'Nội dung sẽ được thêm vào nhật ký N302.':'Việc sẽ xuất hiện trong danh sách cần làm của N302.';document.getElementById('hint').textContent=mode==='note'?'Ghi chú là chuyện đã xảy ra và chỉ vào nhật ký. Nó không tạo thành việc phải hoàn thành.':'Tạo việc cho chuyện cần xử lý sau này. Khi hoàn thành, user sẽ chủ động đánh dấu xong.';validate()}));document.querySelectorAll('.priority button').forEach(btn=>btn.addEventListener('click',()=>{priority=btn.dataset.priority;document.querySelectorAll('.priority button').forEach(x=>x.classList.toggle('on',x===btn))}));document.getElementById('noteContent').addEventListener('input',validate);document.getElementById('taskTitle').addEventListener('input',validate);save.addEventListener('click',()=>{let entry;if(mode==='note'){entry={type:'note',content:document.getElementById('noteContent').value.trim(),date:document.getElementById('noteDate').value,time:document.getElementById('noteTime').value,savedAt:new Date().toISOString()};document.getElementById('doneTitle').textContent='Đã lưu ghi chú N302';document.getElementById('result').textContent=entry.content}else{entry={type:'task',title:document.getElementById('taskTitle').value.trim(),dueDate:document.getElementById('dueDate').value,dueTime:document.getElementById('dueTime').value,priority,note:document.getElementById('taskNote').value.trim(),status:'pending',savedAt:new Date().toISOString()};document.getElementById('doneTitle').textContent='Đã tạo việc N302';document.getElementById('result').textContent=entry.title+' · hạn '+entry.dueDate.split('-').reverse().slice(0,2).join('/')+' lúc '+entry.dueTime}sessionStorage.setItem('vunuoi:n302:note-task',JSON.stringify(entry));form.classList.add('off');document.getElementById('sticky').classList.add('off');document.getElementById('done').classList.add('on');scrollTo(0,0)});
</script><script>let formDirty=false;document.addEventListener('input',e=>{if(e.target.matches('input,textarea,select'))formDirty=true});document.addEventListener('change',e=>{if(e.target.matches('input,textarea,select'))formDirty=true});function leave(url){if(!formDirty||confirm('Bỏ dữ liệu đang nhập?'))location.href=url}</script><div class="appnav" id="appnav" onclick="if(event.target===this)this.classList.remove('on')"><div class="navsheet"><div class="navhandle"></div><div class="navtitle">Đi đến</div><div class="navgrid"><button onclick="leave('pond-detail.html')">Ao N302</button><button onclick="leave('index.html#home')">Hôm nay</button><button onclick="leave('index.html#reports')">Báo cáo</button><button onclick="leave('index.html#seasons')">Mùa vụ</button><button onclick="leave('index.html#tools')">Công cụ</button><button onclick="leave('index.html#settings')">Cài đặt</button></div><button class="navcancel" onclick="document.getElementById('appnav').classList.remove('on')">Ở lại màn này</button></div></div></body></html>
