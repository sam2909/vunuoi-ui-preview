<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>Tạo ao mới · VUNUOI</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#132235;font:14px system-ui,-apple-system,sans-serif}.app{min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dce3e7;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}.topin{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between}.back{border:0;background:none;color:#0f766e;font-weight:850;padding:7px 0}.main{max-width:620px;margin:auto;padding:18px 14px 36px}.eyebrow{font-size:11px;color:#64748b;font-weight:800;text-transform:uppercase}.title{font-size:30px;font-weight:950;line-height:1.1;margin:5px 0}.sub{color:#64748b;font-size:13px}.card{background:#fff;border:1px solid #d9e1e5;border-radius:16px;padding:15px;margin-top:14px}.card h2{font-size:17px;margin:0 0 13px}.field{display:block;margin-top:13px;font-size:12px;color:#526277;font-weight:750}.field input,.field select,.field textarea{display:block;width:100%;min-width:0;margin-top:6px;border:1px solid #cbd5df;border-radius:11px;background:#fff;color:#132235;font:16px system-ui;padding:11px 12px;min-height:46px}.field textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meta{color:#64748b;font-size:12px;line-height:1.45}.callout{background:#eef8f5;border:1px solid #b7ddd4;border-radius:13px;padding:12px;margin-top:13px}.callout b{display:block;color:#0f766e}.rowlink{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid #b7d4cf;background:#fff;color:#0f766e;border-radius:12px;padding:13px;font:750 14px system-ui;margin-top:12px}.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dce3e7;padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:30}.savein{display:flex;gap:9px;max-width:620px;margin:auto}.btn{border:0;border-radius:11px;padding:13px;font:850 15px system-ui}.primary{background:#0f766e;color:#fff;flex:1}.secondary{background:#eef2f4;color:#526277}.summary{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #d9e1e5;border-radius:13px;overflow:hidden;margin-top:12px}.sum{padding:12px;background:#fff}.sum:nth-child(even){border-left:1px solid #e3e8eb}.sum:nth-child(n+3){border-top:1px solid #e3e8eb}.sum small{display:block;color:#64748b;font-size:11px}.sum b{display:block;font-size:17px;margin-top:3px}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#e1e9ec;border-radius:11px;padding:4px;margin-top:9px}.choice button{border:0;background:transparent;color:#64748b;border-radius:8px;padding:10px 4px;font-weight:750}.choice button.on{background:#fff;color:#0f766e;box-shadow:0 1px 3px #13223515}.hide{display:none}@media(max-width:430px){.grid{grid-template-columns:1fr}.main{padding:15px 12px 32px}}@media(min-width:800px){.main{padding-top:26px}.savebar{position:sticky;margin-top:18px;border:0;background:transparent}.savein{justify-content:flex-end}.primary{flex:0 0 220px}}.source{display:none}.source.on{display:block}.btn:disabled{opacity:.45}</style></head><body><div class="app"><header class="top"><div class="topin"><button class="back" id="back">‹ Khu B</button><strong>Tạo ao mới</strong><span></span></div></header><main class="main"><div class="eyebrow">Mùa 27 · Khu B</div><h1 class="title">Tạo ao</h1><p class="sub" id="context">Thêm ao vào khu đang chọn.</p>
<section class="card"><h2>Thông tin ao</h2><label class="field">Tên hoặc mã ao<input id="name" placeholder="Ví dụ N304" autocomplete="off"></label><div class="grid"><label class="field">Mùa vụ<select><option selected>Mùa 27</option></select></label><label class="field">Khu<select><option selected>Khu B</option><option>Khu A</option><option>Khu C</option></select></label></div><label class="field">Diện tích ao (m²)<input type="number" inputmode="decimal" placeholder="Không bắt buộc"></label></section>
<section class="card"><h2>Nguồn đàn</h2><div class="choice" role="group"><button class="on" type="button" data-source="empty">Ao trống</button><button type="button" data-source="new">Thả mới</button><button type="button" data-source="transfer">Nhận sang ao</button></div><div class="source" id="sourceEmpty"><div class="callout"><b>Tạo ao trước, nhập đàn sau</b><span class="meta">Ao chưa có ngày tuổi và chưa được tính thiếu dữ liệu thức ăn.</span></div></div><div class="source" id="sourceNew"><div class="grid"><label class="field">Ngày thả<input type="date" value="2026-09-11"></label><label class="field">Lượng giống<input type="number" inputmode="numeric" placeholder="Số con"></label></div></div><div class="source" id="sourceTransfer"><div class="callout"><b>Ao mới sẽ làm ao nhận</b><span class="meta">Sau khi tạo, quay lại flow sang ao để nhập số lượng, ngày sang và ngày bắt đầu thức ăn.</span></div></div></section>
<section class="card"><label class="field">Ghi chú<textarea placeholder="Thông tin cần nhớ về ao"></textarea></label></section></main>
<div class="savebar"><div class="savein"><button class="btn secondary" id="cancel">Huỷ</button><button class="btn primary" id="save" disabled>Tạo ao</button></div></div></div><script>
const params=new URLSearchParams(location.search),returnTo=params.get('return')==='transfer',name=document.getElementById('name'),save=document.getElementById('save'),back=document.getElementById('back'),cancel=document.getElementById('cancel');let source=returnTo?'transfer':'empty';
document.getElementById('context').textContent=returnTo?'Tạo ao nhận mà không rời flow sang ao.':'Thêm ao vào khu đang chọn.';
function destination(){return returnTo?'pond-transfer.html?newPond='+encodeURIComponent(name.value.trim()):'zone-detail.html'}
back.textContent=returnTo?'‹ Sang ao':'‹ Khu B';back.onclick=cancel.onclick=()=>location.href=returnTo?'pond-transfer.html':'zone-detail.html';
function paint(){document.querySelectorAll('[data-source]').forEach(b=>b.classList.toggle('on',b.dataset.source===source));document.querySelectorAll('.source').forEach(x=>x.classList.remove('on'));document.getElementById(source==='empty'?'sourceEmpty':source==='new'?'sourceNew':'sourceTransfer').classList.add('on')}
document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{source=b.dataset.source;paint()});if(returnTo)document.querySelector('[data-source="transfer"]').click();else paint();
name.oninput=()=>save.disabled=!name.value.trim();save.onclick=()=>{sessionStorage.setItem('vunuoi:newPond',name.value.trim());location.href=destination()}
</script></body></html>
